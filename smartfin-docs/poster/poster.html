<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SmartFin Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --cream: #FFF7EC;
    --ink: #1C1917;
    --ink-2: #57534E;
    --ink-3: #8A817A;
    --orange: #FF9F29;
    --orange-text: #C2680A;
    --kmutt: #E5401A;
    --card: #FFFFFF;
    --line: #EFE6D8;
    --teal: #0D9488;
    --green: #16A34A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    position: relative;
    background: var(--cream);
    font-family: Inter, system-ui, sans-serif;
    color: var(--ink);
  }

  /* ---------- background ---------- */
  .bg { position: absolute; inset: 0; pointer-events: none; }
  .glow {
    position: absolute; border-radius: 50%; filter: blur(10px);
  }
  .glow.a { width: 1100px; height: 1100px; left: 820px; top: 0px;
    background: radial-gradient(circle, rgba(255,159,41,.30) 0%, rgba(255,159,41,.10) 40%, rgba(255,159,41,0) 70%); }
  .glow.b { width: 900px; height: 900px; left: -300px; top: 420px;
    background: radial-gradient(circle, rgba(13,148,136,.12) 0%, rgba(13,148,136,0) 65%); }
  .glow.c { width: 900px; height: 900px; right: -300px; top: 380px;
    background: radial-gradient(circle, rgba(229,64,26,.12) 0%, rgba(229,64,26,0) 65%); }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(28,25,23,.07) 1.6px, transparent 1.8px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(ellipse 60% 75% at 70% 50%, transparent 35%, #000 80%);
            mask-image: radial-gradient(ellipse 60% 75% at 70% 50%, transparent 35%, #000 80%);
  }
  .waves { position: absolute; left: 0; bottom: 0; width: 1920px; height: 520px; }

  /* ---------- left column: logos, title, features ---------- */
  .left-col { position: absolute; left: 88px; top: 60px; width: 740px; }
  .logos { display: flex; align-items: center; gap: 24px; }
  .logos .kmutt { height: 76px; width: 66px; object-fit: contain; object-view-box: inset(12.5% 11% 20.8% 23%); }
  .logos .divider { width: 2px; height: 58px; background: rgba(28,25,23,.25); border-radius: 2px; }
  .logos .sit { height: 60px; }

  .wordmark {
    margin-top: 112px; display: flex;
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;
    font-size: 156px; line-height: .92; letter-spacing: -4.5px; margin-left: -6px;
  }
  .wordmark .fin {
    background: linear-gradient(180deg, #FFB347 0%, #FF8A00 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle {
    margin-top: 26px;
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700;
    font-size: 44px; line-height: 1.12; letter-spacing: -.6px;
  }
  .subtitle2 {
    margin-top: 14px;
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 500;
    font-size: 30px; line-height: 1.25; color: var(--ink-2); letter-spacing: -.3px;
  }
  .subtitle2 b { color: var(--orange-text); font-weight: 700; }
  .mascot { margin-top: 34px; display: flex; align-items: center; gap: 22px; }
  .cat { display: block; flex: none; width: 150px; height: 150px; object-fit: contain;
    filter: drop-shadow(0 14px 18px rgba(120,60,0,.18)); }
  .speech {
    position: relative; max-width: 380px; margin-top: -40px;
    padding: 18px 22px; border-radius: 24px; border-bottom-left-radius: 8px;
    background: #FFFFFF; border: 1px solid rgba(239,230,216,.9);
    box-shadow: 0 20px 40px -18px rgba(90,50,10,.30), 0 2px 6px rgba(90,50,10,.06);
    font-size: 20px; line-height: 1.45; color: var(--ink);
  }
  .speech b { font-weight: 700; color: var(--orange-text); }
  /* tail pointing back at the cat */
  .speech::before {
    content: ""; position: absolute; left: -11px; bottom: 14px;
    width: 20px; height: 20px; background: #FFFFFF;
    border-left: 1px solid rgba(239,230,216,.9); border-bottom: 1px solid rgba(239,230,216,.9);
    transform: rotate(45deg); border-bottom-left-radius: 4px;
  }


  /* ---------- right: three phones ---------- */
  .phone {
    position: absolute;
    width: 476px; height: 1000px;
    border-radius: 74px; padding: 14px;
    background: linear-gradient(145deg, #3a3633, #121110 45%, #2a2725);
    box-shadow:
      0 0 0 2px #4a4541 inset,
      0 50px 90px -20px rgba(120,60,0,.45),
      0 20px 40px -10px rgba(0,0,0,.25);
  }
  .phone .screen {
    width: 100%; height: 100%; border-radius: 60px; overflow: hidden;
    background: #FFF6EA top center / cover no-repeat;
    position: relative;
  }
  .phone .island {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    width: 128px; height: 36px; border-radius: 20px; background: #0b0b0b;
  }
  .phone .btn { position: absolute; width: 5px; background: #2a2725; border-radius: 3px; }
  .phone .btn.l1 { left: -5px; top: 190px; height: 64px; }
  .phone .btn.l2 { left: -5px; top: 270px; height: 64px; }
  .phone .btn.r1 { right: -5px; top: 240px; height: 100px; }
  /* all three phones are the same 476x1000 frame at the same scale, pivoting on their bottom edge.
     The dashboard sits in front and slightly higher; the side phones fan out behind it. */
  .phone.main, .phone.side { transform-origin: bottom center; }
  .phone.main  { left: 1132px; top: -84px; transform: scale(.72); z-index: 3; }
  .phone.side  { top: -48px;
    box-shadow: 0 0 0 2px #4a4541 inset, 0 40px 70px -20px rgba(120,60,0,.35), 0 16px 30px -10px rgba(0,0,0,.2); }
  .phone.left  { left: 842px;  transform: rotate(-5deg) scale(.72); z-index: 1; }
  .phone.right { left: 1422px; transform: rotate(5deg)  scale(.72); z-index: 1; }
  .scr-detect { background-image: url('Auto_Detect_Screen.PNG') !important; }
  .scr-dash   { background-image: url('Dashboard.PNG') !important; }
  .scr-coach  { background-image: url('AI_Coach_Screen.PNG') !important; }

  /* iOS-style banner inside the dashboard phone */
  .banner {
    position: absolute; left: 14px; right: 14px; top: 64px; z-index: 3;
    padding: 14px 16px; border-radius: 26px; background: #FFFFFF;
    box-shadow: 0 14px 30px -10px rgba(90,50,10,.35), 0 1px 3px rgba(0,0,0,.08);
    display: flex; gap: 12px; align-items: center;
  }
  .banner .icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; }
  .banner .icon svg { width: 24px; height: 24px; }
  .banner .t { font-size: 15px; color: var(--ink-3); font-weight: 600; }
  .banner .m { font-size: 18px; font-weight: 600; margin-top: 2px; line-height: 1.3; }

</style>
</head>
<body>

<div class="bg">
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="glow c"></div>
  <div class="dots"></div>
  <svg class="waves" viewBox="0 0 1920 520" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#FF9F29" stop-opacity=".40"/>
        <stop offset=".45" stop-color="#FF9F29" stop-opacity=".05"/>
        <stop offset=".55" stop-color="#FF9F29" stop-opacity=".05"/>
        <stop offset="1" stop-color="#E5401A" stop-opacity=".35"/>
      </linearGradient>
      <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#0D9488" stop-opacity=".22"/>
        <stop offset=".5" stop-color="#0D9488" stop-opacity="0"/>
        <stop offset="1" stop-color="#FF9F29" stop-opacity=".28"/>
      </linearGradient>
      <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#FF9F29" stop-opacity=".9"/>
        <stop offset=".4" stop-color="#FF9F29" stop-opacity="0"/>
        <stop offset=".6" stop-color="#E5401A" stop-opacity="0"/>
        <stop offset="1" stop-color="#E5401A" stop-opacity=".8"/>
      </linearGradient>
    </defs>
    <path d="M0 300 C 260 200, 480 380, 760 300 S 1240 220, 1500 320 S 1800 260, 1920 200 L1920 520 L0 520 Z" fill="url(#w2)"/>
    <path d="M0 380 C 300 290, 520 460, 820 390 S 1280 300, 1540 400 S 1820 330, 1920 300 L1920 520 L0 520 Z" fill="url(#w1)"/>
    <path d="M0 360 C 300 270, 520 440, 820 370 S 1280 280, 1540 380 S 1820 310, 1920 280" fill="none" stroke="url(#ln)" stroke-width="3"/>
    <path d="M0 410 C 300 330, 540 480, 840 420 S 1300 340, 1560 430 S 1830 360, 1920 340" fill="none" stroke="url(#ln)" stroke-width="1.5" opacity=".7"/>
  </svg>
</div>

<!-- left column -->
<div class="left-col">
  <div class="logos">
    <img class="kmutt" src="kmutt_logo.png" alt="KMUTT">
    <div class="divider"></div>
    <img class="sit" src="sit_logo.png" alt="SIT, KMUTT">
  </div>

  <div class="wordmark"><span>Smart</span><span class="fin">Fin</span></div>
  <div class="subtitle">Automatic Expense Tracking with Thai E-Slip Recognition</div>
  <div class="subtitle2">and an <b>AI Financial Coach</b><br>that reads your own spending</div>
  <div class="mascot">
    <img class="cat" src="../../smartfin-flutter/assets/images/lucky_cat.png" alt="SmartFin AI Coach lucky cat">
    <div class="speech">Hi! 🐾 I'm <b>Kwak</b>, your AI Coach. Ask me anything about your spending!</div>
  </div>

</div>

<!-- right: phones (left = auto-detect, front = dashboard, right = coach) -->
<div class="phone side left">
  <div class="btn l1"></div><div class="btn l2"></div><div class="btn r1"></div>
  <div class="screen scr-detect"><div class="island"></div></div>
</div>

<div class="phone side right">
  <div class="btn l1"></div><div class="btn l2"></div><div class="btn r1"></div>
  <div class="screen scr-coach"><div class="island"></div></div>
</div>

<div class="phone main">
  <div class="btn l1"></div><div class="btn l2"></div><div class="btn r1"></div>
  <div class="screen scr-dash">
    <div class="island"></div>
    <div class="banner">
      <div class="icon" style="background:#FFF1DE">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E07F0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </div>
      <div>
        <div class="t">Bill reminder · 09:00</div>
        <div class="m">฿599 bill is due tomorrow</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
