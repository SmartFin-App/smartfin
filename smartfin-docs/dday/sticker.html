<script>
  // 20 rays fanning out from behind the cat
  const g = document.getElementById('rays');
  const cx = 600, cy = 530, R = 900;
  for (let i = 0; i < 20; i++) {
    const a0 = (i * 18) * Math.PI / 180, a1 = (i * 18 + 7) * Math.PI / 180;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M${cx} ${cy} L${cx + R * Math.cos(a0)} ${cy + R * Math.sin(a0)} L${cx + R * Math.cos(a1)} ${cy + R * Math.sin(a1)} Z`);
    g.appendChild(p);
  }
</script>
